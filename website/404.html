<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>Page not found</title>
  <style>
    :root { color-scheme: dark }
    * { box-sizing: border-box }
    body { margin: 0; background: #0d1117; color: #f0f6fc; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
    main { min-height: 100vh; display: grid; place-items: center; padding: 28px }
    section { width: min(100%, 680px) }
    p { color: #8b949e }
    .code { color: #58a6ff; font: 700 13px ui-monospace, Consolas, monospace }
    h1 { margin: 8px 0; font-size: clamp(42px, 9vw, 76px); letter-spacing: -0.04em }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px }
    a { padding: 11px 16px; border: 1px solid #30363d; border-radius: 7px; background: #21262d; color: #f0f6fc; text-decoration: none; font-weight: 650 }
    a:first-child { background: #238636 }
    a:focus-visible { outline: 3px solid #58a6ff; outline-offset: 3px }
  </style>
</head>
<body>
  <main>
    <section>
      <div>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The link may be old or typed wrong</p>
        <nav aria-label="Page not found links">
          <a href="https://kaisensushi.github.io/Programming-learning/">go back home</a>
          <a href="https://github.com/KaisenSushi/Programming-learning">open GitHub</a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
